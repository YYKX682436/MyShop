server:
  port: 8083
  servlet:
    context-path: /api

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-must-be-at-least-64-bytes-long-and-random-for-tests-2026
  expiration: 86400000

upload:
  path: ./test-uploads
  url-prefix: /uploads

logging:
  level:
    com.myshop: INFO
