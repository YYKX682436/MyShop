# MyShop Phase 1: PostgreSQL, API, Web, node-exporter, and one reverse proxy.
# API, Web, and node-exporter have no host port; all public traffic enters through Caddy.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myshop
      POSTGRES_USER: ${DB_USERNAME:-myshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.30.0.10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-myshop-api:local}
    environment:
      TZ: Asia/Shanghai
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/myshop}
      DB_USERNAME: ${DB_USERNAME:-myshop}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      UPLOAD_URL_PREFIX: ${UPLOAD_URL_PREFIX:-/api/uploads}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SITE_URL: ${MAIL_SITE_URL:-https://store.invalid}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-172.30.0.2,127.0.0.1,::1}
      NODE_EXPORTER_URL: ${NODE_EXPORTER_URL:-http://node-exporter:9100}
      DATA_DISK_MOUNTPOINT: ${DATA_DISK_MOUNTPOINT:-/data}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/api/site/config || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.30.0.20

  node-exporter:
    # Optional sidecar: it must not appear in any application depends_on chain.
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.30.0.40

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${WEB_IMAGE:-myshop-web:local}
    environment:
      TZ: Asia/Shanghai
      BACKEND_URL: http://api:8083
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.30.0.30

  caddy:
    # The public edge depends only on API/Web; the monitoring sidecar is never a startup dependency.
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.30.0.2

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
