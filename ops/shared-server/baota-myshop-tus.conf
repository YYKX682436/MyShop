# Include inside each MyShop server block, not the global http block.
# Browser caches still honor the application's immutable response headers.
# A shared proxy cache can otherwise serve media after its asset was deleted,
# and its default HEAD-to-GET conversion breaks tus resume requests.
proxy_cache off;

location ^~ /api/admin/media/tus {
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_buffering off;
}
