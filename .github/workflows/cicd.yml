name: MyShop CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Enforce PostgreSQL integration tests
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail

          # The test class keeps disabledWithoutDocker=true so local developers
          # can still run ordinary tests without installing Docker. CI must
          # explicitly prove that Docker is available and must fail if any of
          # the PostgreSQL/Testcontainers tests is skipped.
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker info --format 'server={{.ServerVersion}} containers={{.Containers}}'

          reports=(
            target/surefire-reports/TEST-com.myshop.service.impl.AdminProductAssignedUuidIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.MigrationChainIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderNumberConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderRefundConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.PostgresDeliveryIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.AfterSaleConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.SalesChannelDomainIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.SalesChannelPhase4PostgresIntegrationTest.xml
          )
          rm -f "${reports[@]}"
          mvn -B \
            -Dtest=AdminProductAssignedUuidIntegrationTest,MigrationChainIntegrationTest,OrderNumberConcurrencyIntegrationTest,OrderRefundConcurrencyIntegrationTest,PostgresDeliveryIntegrationTest,AfterSaleConcurrencyIntegrationTest,SalesChannelDomainIntegrationTest,SalesChannelPhase4PostgresIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=true \
            test

          REPORTS="${reports[*]}" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = [Path(value) for value in os.environ["REPORTS"].split()]
          results = []
          for report in reports:
              if not report.is_file():
                  raise SystemExit(f"Missing Surefire report: {report}")

              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", "0"))
              failures = int(suite.attrib.get("failures", "0"))
              errors = int(suite.attrib.get("errors", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              result = (
                  f"{report.stem.removeprefix('TEST-com.myshop.service.impl.')} "
                  "PostgreSQL/Testcontainers: "
                  f"Tests run: {tests}, Failures: {failures}, "
                  f"Errors: {errors}, Skipped: {skipped}"
              )
              results.append((result, tests, failures, errors, skipped))
              print(result)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### PostgreSQL/Testcontainers integration tests\n\n")
                  for result, *_ in results:
                      summary.write(f"- {result}\n")

          invalid = [result for result, tests, failures, errors, skipped in results
                     if tests <= 0 or failures != 0 or errors != 0 or skipped != 0]
          if invalid:
              raise SystemExit(
                  "PostgreSQL/Testcontainers integration test execution contract failed:\n"
                  + "\n".join(invalid)
              )
          PY
      - name: Build and test
        working-directory: apps/api
        run: mvn -B verify
      - name: Build API image smoke
        run: docker build --file Dockerfile.api --tag myshop-api:ci .

  web:
    name: Web typecheck, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myshop/web exec tsc --noEmit
      - run: pnpm --filter @myshop/web test:logic
      - run: pnpm --filter @myshop/web lint
      - run: pnpm --filter @myshop/web build
      - name: Build Web image smoke
        run: docker build --file Dockerfile.web --tag myshop-web:ci .

  compose:
    name: Compose configuration smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run storage lifecycle regression tests
        run: bash scripts/test-storage-lifecycle.sh
      - name: Run deployment transaction regression tests
        run: bash scripts/test-deployment-transaction.sh
      - name: Run production schema contract regression tests
        run: bash scripts/test-production-schema-contract.sh
      - name: Validate required Compose variables
        run: bash scripts/check-compose.sh

  publish-images:
    name: Publish immutable production images
    needs: [api, web, compose]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Normalize image owner
        id: image-owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: echo "owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and publish API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ steps.image-owner.outputs.owner }}/myshop-api:${{ github.sha }}
          cache-from: type=gha,scope=myshop-api
          cache-to: type=gha,mode=max,scope=myshop-api
      - name: Build and publish Web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ steps.image-owner.outputs.owner }}/myshop-web:${{ github.sha }}
          cache-from: type=gha,scope=myshop-web
          cache-to: type=gha,mode=max,scope=myshop-web
      - name: Generate immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ steps.image-owner.outputs.owner }}
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          api_digest = os.environ["API_DIGEST"]
          web_digest = os.environ["WEB_DIGEST"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid source SHA")
          for value in (api_digest, web_digest):
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
                  raise SystemExit(f"invalid builder digest: {value}")
          owner = os.environ["IMAGE_OWNER"]
          manifest = {
              "version": 1,
              "project": "myshop",
              "source_sha": sha,
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "images": {
                  "api": {"ref": f"ghcr.io/{owner}/myshop-api:{sha}", "digest": api_digest},
                  "web": {"ref": f"ghcr.io/{owner}/myshop-web:{sha}", "digest": web_digest},
              },
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload immutable release manifest
        uses: actions/upload-artifact@v4
        with:
          name: myshop-release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
