name: MyShop CI

on:
  workflow_dispatch:
    inputs:
      mirror_base_images:
        description: Mirror pinned base images instead of building a release
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    if: ${{ !inputs.mirror_base_images }}
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Enforce PostgreSQL integration tests
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail

          # The test class keeps disabledWithoutDocker=true so local developers
          # can still run ordinary tests without installing Docker. CI must
          # explicitly prove that Docker is available and must fail if any of
          # the PostgreSQL/Testcontainers tests is skipped.
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker info --format 'server={{.ServerVersion}} containers={{.Containers}}'

          reports=(
            target/surefire-reports/TEST-com.myshop.service.impl.AdminProductAssignedUuidIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.MigrationChainIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderNumberConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderRefundConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.PostgresDeliveryIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.AfterSaleConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.BalanceAdjustmentConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.UserAvatarTransactionIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.CoreStabilityPostgresIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.UserLevelConcurrencyIntegrationTest.xml
          )
          rm -f "${reports[@]}"
          mvn -B \
            -Dtest=AdminProductAssignedUuidIntegrationTest,MigrationChainIntegrationTest,OrderNumberConcurrencyIntegrationTest,OrderRefundConcurrencyIntegrationTest,PostgresDeliveryIntegrationTest,AfterSaleConcurrencyIntegrationTest,BalanceAdjustmentConcurrencyIntegrationTest,UserAvatarTransactionIntegrationTest,CoreStabilityPostgresIntegrationTest,UserLevelConcurrencyIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=true \
            test

          REPORTS="${reports[*]}" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = [Path(value) for value in os.environ["REPORTS"].split()]
          results = []
          for report in reports:
              if not report.is_file():
                  raise SystemExit(f"Missing Surefire report: {report}")

              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", "0"))
              failures = int(suite.attrib.get("failures", "0"))
              errors = int(suite.attrib.get("errors", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              result = (
                  f"{report.stem.removeprefix('TEST-com.myshop.service.impl.')} "
                  "PostgreSQL/Testcontainers: "
                  f"Tests run: {tests}, Failures: {failures}, "
                  f"Errors: {errors}, Skipped: {skipped}"
              )
              results.append((result, tests, failures, errors, skipped))
              print(result)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### PostgreSQL/Testcontainers integration tests\n\n")
                  for result, *_ in results:
                      summary.write(f"- {result}\n")

          invalid = [result for result, tests, failures, errors, skipped in results
                     if tests <= 0 or failures != 0 or errors != 0 or skipped != 0]
          if invalid:
              raise SystemExit(
                  "PostgreSQL/Testcontainers integration test execution contract failed:\n"
                  + "\n".join(invalid)
              )
          PY
      - name: Build and test
        working-directory: apps/api
        run: mvn -B verify
      - name: Build API image smoke
        run: docker build --file Dockerfile.api --tag myshop-api:ci .

  web:
    if: ${{ !inputs.mirror_base_images }}
    name: Web typecheck, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myshop/web exec tsc --noEmit
      - run: pnpm --filter @myshop/web test:logic
      - run: pnpm --filter @myshop/web lint
      - run: pnpm --filter @myshop/web build
      - name: Build Web image smoke
        run: docker build --file Dockerfile.web --tag myshop-web:ci .

  compose:
    if: ${{ !inputs.mirror_base_images }}
    name: Compose configuration smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test GHCR release manifest carrier and fetcher contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run storage lifecycle regression tests
        run: bash scripts/test-storage-lifecycle.sh
      - name: Run deployment transaction regression tests
        run: bash scripts/test-deployment-transaction.sh
      - name: Check production shell entry syntax
        run: bash -n scripts/deploy-production.sh scripts/myshop-compose.sh
      - name: Run production schema contract regression tests
        run: bash scripts/test-production-schema-contract.sh
      - name: Validate required Compose variables
        run: bash scripts/check-compose.sh

  mirror-base-images:
    name: Mirror approved base images to GHCR
    if: ${{ inputs.mirror_base_images }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify shared image pins and legacy production isolation
        run: bash scripts/test-shared-server-images.sh
      - name: Install Skopeo from Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          skopeo --version
      - name: Authenticate to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | skopeo login \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Copy source-pinned multi-platform manifests and verify identity
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ghcr-auth.json
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS='|' read -r name source expected tag; do
            [[ -n "$name" ]] || continue
            source_ref="docker://$source@$expected"
            target_ref="docker://ghcr.io/yykx682436/myshop-$name:$tag"
            source_raw="$RUNNER_TEMP/$name-source-manifest.json"
            target_raw="$RUNNER_TEMP/$name-target-manifest.json"

            skopeo inspect --raw --tls-verify=true "$source_ref" > "$source_raw"
            source_digest="sha256:$(sha256sum "$source_raw" | awk '{print $1}')"
            [[ "$source_digest" == "$expected" ]] || {
              printf 'Source digest mismatch for %s: %s\n' "$name" "$source_digest" >&2
              exit 1
            }
            python3 - "$source_raw" "$name" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          platforms = {
              f"{item.get('platform', {}).get('os')}/{item.get('platform', {}).get('architecture')}"
              for item in manifest.get("manifests", [])
          }
          if "linux/amd64" not in platforms:
              raise SystemExit(f"{sys.argv[2]} source index is missing linux/amd64")
          print(f"{sys.argv[2]} source platforms: {', '.join(sorted(platforms))}")
          PY

            skopeo copy --all --preserve-digests \
              --src-tls-verify=true --dest-tls-verify=true \
              --authfile "$REGISTRY_AUTH_FILE" \
              --digestfile "$RUNNER_TEMP/$name-destination.digest" \
              "$source_ref" "$target_ref"

            skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" \
              --tls-verify=true "$target_ref" > "$target_raw"
            target_digest="sha256:$(sha256sum "$target_raw" | awk '{print $1}')"
            [[ "$target_digest" == "$source_digest" ]] || {
              printf 'Destination digest mismatch for %s: %s != %s\n' \
                "$name" "$target_digest" "$source_digest" >&2
              exit 1
            }
            python3 - "$target_raw" "$name" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          platforms = {
              f"{item.get('platform', {}).get('os')}/{item.get('platform', {}).get('architecture')}"
              for item in manifest.get("manifests", [])
          }
          if "linux/amd64" not in platforms:
              raise SystemExit(f"{sys.argv[2]} target index is missing linux/amd64")
          PY
            printf '%s|%s|%s\n' "$name" "$source_digest" "$target_digest" \
              >> "$RUNNER_TEMP/myshop-base-image-digests.txt"
          done <<'IMAGES'
          postgres|docker.io/library/postgres|sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685|mirror-cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          caddy|docker.io/library/caddy|sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648|mirror-5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          node-exporter|quay.io/prometheus/node-exporter|sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0|mirror-1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          IMAGES

          {
            printf '| Image | Source digest | GHCR digest |\n|---|---|---|\n'
            while IFS='|' read -r name source_digest target_digest; do
              printf '| %s | \`%s\` | \`%s\` |\n' "$name" "$source_digest" "$target_digest"
            done < "$RUNNER_TEMP/myshop-base-image-digests.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    name: Publish immutable production images
    needs: [api, web, compose]
    if: ${{ !inputs.mirror_base_images && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/yykx682436/myshop-api:${{ github.sha }}
          cache-from: type=gha,scope=myshop-api
          cache-to: type=gha,mode=max,scope=myshop-api
      - name: Build and publish Web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/yykx682436/myshop-web:${{ github.sha }}
          cache-from: type=gha,scope=myshop-web
          cache-to: type=gha,mode=max,scope=myshop-web
      - name: Generate immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          api_digest = os.environ["API_DIGEST"]
          web_digest = os.environ["WEB_DIGEST"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid source SHA")
          for value in (api_digest, web_digest):
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
                  raise SystemExit(f"invalid builder digest: {value}")
          manifest = {
              "version": 1,
              "project": "myshop",
              "source_sha": sha,
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "images": {
                  "api": {"ref": f"ghcr.io/yykx682436/myshop-api:{sha}", "digest": api_digest},
                  "web": {"ref": f"ghcr.io/yykx682436/myshop-web:{sha}", "digest": web_digest},
              },
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 scripts/validate-release-manifest.py release-manifest.json ghcr.io/yykx682436 myshop > "$RUNNER_TEMP/validated-release-manifest.json"
      - name: Push and round-trip the immutable manifest carrier
        env:
          SOURCE_SHA: ${{ github.sha }}
          CARRIER_CONTEXT: ${{ runner.temp }}/myshop-manifest-carrier/${{ github.sha }}
          FETCHED_MANIFEST: ${{ runner.temp }}/myshop-release-manifest-${{ github.sha }}.json
        shell: bash
        run: |
          set -Eeuo pipefail
          source_url=https://github.com/YYKX682436/MyShop
          carrier_ref="ghcr.io/yykx682436/myshop-release-manifest:${SOURCE_SHA}"
          mkdir -p "$CARRIER_CONTEXT"
          cp release-manifest.json "$CARRIER_CONTEXT/release-manifest.json"
          cat > "$CARRIER_CONTEXT/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY release-manifest.json /release-manifest.json
          DOCKERFILE
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$source_url" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$carrier_ref" "$CARRIER_CONTEXT"
          if ! push_log=$(docker push "$carrier_ref" 2>&1); then
            printf '%s\n' "$push_log"
            exit 1
          fi
          printf '%s\n' "$push_log"
          carrier_digest=$(printf '%s\n' "$push_log" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)
          [[ "$carrier_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { printf 'could not parse manifest carrier registry digest\n' >&2; exit 1; }
          docker image rm "$carrier_ref" >/dev/null
          bash scripts/fetch-release-manifest.sh "$SOURCE_SHA" "$carrier_digest" "$FETCHED_MANIFEST"
          cmp release-manifest.json "$FETCHED_MANIFEST"
          python3 scripts/validate-release-manifest.py "$FETCHED_MANIFEST" ghcr.io/yykx682436 myshop >/dev/null
          {
            printf 'source_sha=%s\nmanifest_carrier_ref=%s\nmanifest_carrier_digest=%s\n' \
              "$SOURCE_SHA" "$carrier_ref" "$carrier_digest"
          } >> "$GITHUB_STEP_SUMMARY"
