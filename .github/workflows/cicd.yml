name: MyShop CI

on:
  workflow_dispatch:

concurrency:
  group: myshop-manual-release
  queue: max
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: Select checks from a verified CI baseline
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      compose: ${{ steps.changes.outputs.compose }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the latest successful ancestor release
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci-release-scope.py

  api:
    needs: scope
    if: ${{ needs.scope.outputs.api == 'true' }}
    name: API build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install image and video processing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libvips-tools libheif1 libheif-examples libheif-plugin-libde265 libheif-plugin-aomdec icc-profiles-free ffmpeg
      - name: Build and test, including required PostgreSQL integration tests
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail

          # Local developers may use disposable loopback databases or skip
          # Docker-backed tests. CI must prove Docker is available and fail if
          # any PostgreSQL integration test was skipped.
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker info --format 'server={{.ServerVersion}} containers={{.Containers}}'

          reports=(
            target/surefire-reports/TEST-com.myshop.service.impl.AdminProductAssignedUuidIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.MigrationChainIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderNumberConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderRefundConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.SubsiteConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.SupplierPurchasePostgresIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.PostgresDeliveryIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.AfterSaleConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.BalanceAdjustmentConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.UserAvatarTransactionIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.CoreStabilityPostgresIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.MediaMaintenancePostgresIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.controller.UploadControllerTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.UserLevelConcurrencyIntegrationTest.xml
          )
          rm -f "${reports[@]}"
          # Run the entire suite once; the report checks below still require
          # every critical PostgreSQL suite to execute without skips.
          mvn -B verify

          REPORTS="${reports[*]}" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = [Path(value) for value in os.environ["REPORTS"].split()]
          results = []
          for report in reports:
              if not report.is_file():
                  raise SystemExit(f"Missing Surefire report: {report}")

              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", "0"))
              failures = int(suite.attrib.get("failures", "0"))
              errors = int(suite.attrib.get("errors", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              result = (
                  f"{report.stem.removeprefix('TEST-com.myshop.service.impl.')} "
                  "PostgreSQL/Testcontainers: "
                  f"Tests run: {tests}, Failures: {failures}, "
                  f"Errors: {errors}, Skipped: {skipped}"
              )
              results.append((result, tests, failures, errors, skipped))
              print(result)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### PostgreSQL/Testcontainers integration tests\n\n")
                  for result, *_ in results:
                      summary.write(f"- {result}\n")

          invalid = [result for result, tests, failures, errors, skipped in results
                     if tests <= 0 or failures != 0 or errors != 0 or skipped != 0]
          if invalid:
              raise SystemExit(
                  "PostgreSQL/Testcontainers integration test execution contract failed:\n"
                  + "\n".join(invalid)
              )
          PY
  web:
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    name: Web typecheck, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myshop/web exec tsc --noEmit
      - run: pnpm --filter @myshop/web test:logic
      - run: pnpm --filter @myshop/web test:legacy-image-cache
      - run: pnpm --filter @myshop/web lint
  compose:
    needs: scope
    if: ${{ needs.scope.outputs.compose == 'true' }}
    name: Compose configuration smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test GHCR release manifest carrier and fetcher contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run storage lifecycle regression tests
        run: bash scripts/test-storage-lifecycle.sh
      - name: Run deployment transaction regression tests
        run: bash scripts/test-deployment-transaction.sh
      - name: Check production shell entry syntax
        run: bash -n scripts/deploy-production.sh scripts/myshop-compose.sh
      - name: Run production schema contract regression tests
        run: bash scripts/test-production-schema-contract.sh
      - name: Check shared-server isolation, proxy and preflight
        run: |
          bash scripts/test-shared-server-images.sh
          bash scripts/test-shared-server-proxy-config.sh
          bash scripts/test-shared-server-isolation.sh
          bash scripts/test-shared-server-preflight.sh
          bash scripts/test-shared-server-audit.sh
      - name: Validate required Compose variables
        run: bash scripts/check-compose.sh

  publish-images:
    name: Publish immutable production images
    needs: [scope, api, web, compose]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          needs.scope.result == 'success' && needs.scope.outputs.runtime == 'true' &&
          (needs.api.result == 'success' || (needs.scope.outputs.api == 'false' && needs.api.result == 'skipped')) &&
          (needs.web.result == 'success' || (needs.scope.outputs.web == 'false' && needs.web.result == 'skipped')) &&
          (needs.compose.result == 'success' || (needs.scope.outputs.compose == 'false' && needs.compose.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Confirm release SHA is still current on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            printf 'Refusing stale release SHA %s; main is now %s\n' "$GITHUB_SHA" "$main_sha" >&2
            exit 1
          }
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Expose Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build images and offline archives in parallel
        id: images
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARCHIVE_DIR: ${{ runner.temp }}/myshop-release-archives
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$ARCHIVE_DIR"
          build_image() {
            local service=$1
            local extra=()
            [[ "$service" != api ]] || extra+=(--build-arg SKIP_TESTS=true)
            docker buildx build --platform linux/amd64 --provenance=false \
              --file "Dockerfile.$service" --tag "ghcr.io/yykx682436/myshop-$service:$SOURCE_SHA" \
              --cache-from "type=gha,scope=myshop-$service" \
              --cache-to "type=gha,mode=max,scope=myshop-$service" \
              --output type=registry --output "type=docker,dest=$ARCHIVE_DIR/$service.tar" \
              --metadata-file "$RUNNER_TEMP/$service-metadata.json" "${extra[@]}" .
          }
          build_image api >"$RUNNER_TEMP/api-build.log" 2>&1 & api_pid=$!
          build_image web >"$RUNNER_TEMP/web-build.log" 2>&1 & web_pid=$!
          api_status=0; wait "$api_pid" || api_status=$?
          web_status=0; wait "$web_pid" || web_status=$?
          cat "$RUNNER_TEMP/api-build.log" "$RUNNER_TEMP/web-build.log"
          (( api_status == 0 && web_status == 0 )) || exit 1
          python3 - <<'PYCODE'
          import hashlib, json, os, re, subprocess, tarfile
          from pathlib import Path
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for service in ("api", "web"):
                  metadata = json.loads(Path(os.environ["RUNNER_TEMP"], f"{service}-metadata.json").read_text())
                  digest = metadata.get("containerimage.digest", "")
                  if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                      raise SystemExit(f"invalid {service} registry digest")
                  ref = f"ghcr.io/yykx682436/myshop-{service}:{os.environ['SOURCE_SHA']}"
                  def inspect(image):
                      return json.loads(subprocess.check_output(["docker", "buildx", "imagetools", "inspect", "--raw", image]))
                  registry_manifest = inspect(f"{ref}@{digest}")
                  if "manifests" in registry_manifest:
                      matches = [item for item in registry_manifest["manifests"]
                                 if item.get("platform", {}).get("os") == "linux"
                                 and item.get("platform", {}).get("architecture") == "amd64"]
                      if len(matches) != 1:
                          raise SystemExit(f"{service} registry index does not contain exactly one linux/amd64 image")
                      registry_manifest = inspect(f"{ref}@{matches[0]['digest']}")
                  with tarfile.open(Path(os.environ["ARCHIVE_DIR"], f"{service}.tar"), "r:") as archive:
                      records = json.load(archive.extractfile("manifest.json"))
                      if len(records) != 1 or records[0].get("RepoTags") != [ref]:
                          raise SystemExit(f"{service} archive tag does not match the release")
                      config = archive.extractfile(records[0]["Config"]).read()
                  config_digest = "sha256:" + hashlib.sha256(config).hexdigest()
                  if config_digest != registry_manifest.get("config", {}).get("digest"):
                      raise SystemExit(f"{service} archive differs from the published image")
                  output.write(f"{service}_digest={digest}\n")
          PYCODE
          docker load --input "$ARCHIVE_DIR/web.tar"
          docker tag "ghcr.io/yykx682436/myshop-web:$SOURCE_SHA" myshop-web:ci
          bash scripts/test-web-image-host-routing.sh
          # Test the exact archive that will be deployed, including the Noble
          # HEIC/AVIF decoders and the runtime's non-root identity.
          docker load --input "$ARCHIVE_DIR/api.tar"
          docker run --rm --entrypoint /bin/sh \
            --volume "$PWD/scripts/probe-vips-image-formats.sh:/probe.sh:ro" \
            --volume "$PWD/apps/api/src/test/resources/media-formats:/samples:ro" \
            "ghcr.io/yykx682436/myshop-api:$SOURCE_SHA" /probe.sh \
            /samples/fox-derived.heic /samples/fox.avif
      - name: Generate immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.images.outputs.web_digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          api_digest = os.environ["API_DIGEST"]
          web_digest = os.environ["WEB_DIGEST"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid source SHA")
          for value in (api_digest, web_digest):
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
                  raise SystemExit(f"invalid builder digest: {value}")
          manifest = {
              "version": 1,
              "project": "myshop",
              "source_sha": sha,
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "images": {
                  "api": {"ref": f"ghcr.io/yykx682436/myshop-api:{sha}", "digest": api_digest},
                  "web": {"ref": f"ghcr.io/yykx682436/myshop-web:{sha}", "digest": web_digest},
              },
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 scripts/validate-release-manifest.py release-manifest.json ghcr.io/yykx682436 myshop > "$RUNNER_TEMP/validated-release-manifest.json"
      - name: Confirm release SHA is still current before publishing manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            printf 'Refusing stale release SHA %s; main is now %s\n' "$GITHUB_SHA" "$main_sha" >&2
            exit 1
          }
      - name: Push the immutable manifest carrier
        env:
          SOURCE_SHA: ${{ github.sha }}
          CARRIER_CONTEXT: ${{ runner.temp }}/myshop-manifest-carrier/${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source_url=https://github.com/YYKX682436/MyShop
          carrier_ref="ghcr.io/yykx682436/myshop-release-manifest:${SOURCE_SHA}"
          mkdir -p "$CARRIER_CONTEXT"
          cp release-manifest.json "$CARRIER_CONTEXT/release-manifest.json"
          cat > "$CARRIER_CONTEXT/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY release-manifest.json /release-manifest.json
          DOCKERFILE
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$source_url" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$carrier_ref" "$CARRIER_CONTEXT"
          if ! push_log=$(docker push "$carrier_ref" 2>&1); then
            printf '%s\n' "$push_log"
            exit 1
          fi
          printf '%s\n' "$push_log"
          carrier_digest=$(printf '%s\n' "$push_log" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)
          [[ "$carrier_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { printf 'could not parse manifest carrier registry digest\n' >&2; exit 1; }
          {
            printf 'source_sha=%s\nmanifest_carrier_ref=%s\nmanifest_carrier_digest=%s\n' \
              "$SOURCE_SHA" "$carrier_ref" "$carrier_digest"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$carrier_digest" > "$RUNNER_TEMP/manifest-carrier-digest.txt"
      - name: Prepare verified offline release archives
        id: prepare-offline-archives
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARCHIVE_DIR: ${{ runner.temp }}/myshop-release-archives
        shell: bash
        run: |
          set -Eeuo pipefail
          cp release-manifest.json "$ARCHIVE_DIR/release-manifest.json"
          cp "$RUNNER_TEMP/manifest-carrier-digest.txt" "$ARCHIVE_DIR/manifest-carrier-digest.txt"
          (cd "$ARCHIVE_DIR" && sha256sum api.tar web.tar release-manifest.json manifest-carrier-digest.txt > SHA256SUMS)
      - name: Upload offline release archives
        id: offline-archives
        uses: actions/upload-artifact@v4
        with:
          name: myshop-release-${{ github.sha }}
          path: ${{ runner.temp }}/myshop-release-archives/
          if-no-files-found: error
          compression-level: 1
          retention-days: 2
