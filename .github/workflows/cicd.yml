name: MyShop CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Enforce PostgreSQL integration tests
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail

          # The test class keeps disabledWithoutDocker=true so local developers
          # can still run ordinary tests without installing Docker. CI must
          # explicitly prove that Docker is available and must fail if any of
          # the PostgreSQL/Testcontainers tests is skipped.
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker info --format 'server={{.ServerVersion}} containers={{.Containers}}'

          reports=(
            target/surefire-reports/TEST-com.myshop.service.impl.AdminProductAssignedUuidIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.MigrationChainIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderNumberConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.OrderRefundConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.PostgresDeliveryIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.AfterSaleConcurrencyIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.impl.SalesChannelDomainIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.SalesChannelPhase4PostgresIntegrationTest.xml
            target/surefire-reports/TEST-com.myshop.service.XianyuItemBindingPostgresIntegrationTest.xml
          )
          rm -f "${reports[@]}"
          mvn -B \
            -Dtest=AdminProductAssignedUuidIntegrationTest,MigrationChainIntegrationTest,OrderNumberConcurrencyIntegrationTest,OrderRefundConcurrencyIntegrationTest,PostgresDeliveryIntegrationTest,AfterSaleConcurrencyIntegrationTest,SalesChannelDomainIntegrationTest,SalesChannelPhase4PostgresIntegrationTest,com.myshop.service.XianyuItemBindingPostgresIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=true \
            test

          REPORTS="${reports[*]}" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = [Path(value) for value in os.environ["REPORTS"].split()]
          results = []
          for report in reports:
              if not report.is_file():
                  raise SystemExit(f"Missing Surefire report: {report}")

              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", "0"))
              failures = int(suite.attrib.get("failures", "0"))
              errors = int(suite.attrib.get("errors", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              result = (
                  f"{report.stem.removeprefix('TEST-com.myshop.service.impl.')} "
                  "PostgreSQL/Testcontainers: "
                  f"Tests run: {tests}, Failures: {failures}, "
                  f"Errors: {errors}, Skipped: {skipped}"
              )
              results.append((result, tests, failures, errors, skipped))
              print(result)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### PostgreSQL/Testcontainers integration tests\n\n")
                  for result, *_ in results:
                      summary.write(f"- {result}\n")

          invalid = [result for result, tests, failures, errors, skipped in results
                     if tests <= 0 or failures != 0 or errors != 0 or skipped != 0]
          if invalid:
              raise SystemExit(
                  "PostgreSQL/Testcontainers integration test execution contract failed:\n"
                  + "\n".join(invalid)
              )
          PY
      - name: Build and test
        working-directory: apps/api
        run: mvn -B verify
      - name: Build API image smoke
        run: docker build --file Dockerfile.api --tag myshop-api:ci .

  web:
    name: Web typecheck, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myshop/web exec tsc --noEmit
      - run: pnpm --filter @myshop/web test:logic
      - run: pnpm --filter @myshop/web lint
      - run: pnpm --filter @myshop/web build
      - name: Build Web image smoke
        run: docker build --file Dockerfile.web --tag myshop-web:ci .

  compose:
    name: Compose configuration smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test GHCR release manifest carrier and fetcher contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Run storage lifecycle regression tests
        run: bash scripts/test-storage-lifecycle.sh
      - name: Run deployment transaction regression tests
        run: bash scripts/test-deployment-transaction.sh
      - name: Check production shell entry syntax
        run: bash -n scripts/deploy-production.sh scripts/deploy-runtime-config.sh scripts/read-runtime-config-safety.sh scripts/myshop-compose.sh
      - name: Run production schema contract regression tests
        run: bash scripts/test-production-schema-contract.sh
      - name: Validate required Compose variables
        run: bash scripts/check-compose.sh

  publish-images:
    name: Publish immutable production images
    needs: [api, web, compose]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/yykx682436/myshop-api:${{ github.sha }}
          cache-from: type=gha,scope=myshop-api
          cache-to: type=gha,mode=max,scope=myshop-api
      - name: Build and publish Web image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/yykx682436/myshop-web:${{ github.sha }}
          cache-from: type=gha,scope=myshop-web
          cache-to: type=gha,mode=max,scope=myshop-web
      - name: Generate immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          api_digest = os.environ["API_DIGEST"]
          web_digest = os.environ["WEB_DIGEST"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid source SHA")
          for value in (api_digest, web_digest):
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", value):
                  raise SystemExit(f"invalid builder digest: {value}")
          manifest = {
              "version": 1,
              "project": "myshop",
              "source_sha": sha,
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "images": {
                  "api": {"ref": f"ghcr.io/yykx682436/myshop-api:{sha}", "digest": api_digest},
                  "web": {"ref": f"ghcr.io/yykx682436/myshop-web:{sha}", "digest": web_digest},
              },
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 scripts/validate-release-manifest.py release-manifest.json ghcr.io/yykx682436 myshop > "$RUNNER_TEMP/validated-release-manifest.json"
      - name: Push and round-trip the immutable manifest carrier
        env:
          SOURCE_SHA: ${{ github.sha }}
          CARRIER_CONTEXT: ${{ runner.temp }}/myshop-manifest-carrier/${{ github.sha }}
          FETCHED_MANIFEST: ${{ runner.temp }}/myshop-release-manifest-${{ github.sha }}.json
        shell: bash
        run: |
          set -Eeuo pipefail
          source_url=https://github.com/YYKX682436/MyShop
          carrier_ref="ghcr.io/yykx682436/myshop-release-manifest:${SOURCE_SHA}"
          mkdir -p "$CARRIER_CONTEXT"
          cp release-manifest.json "$CARRIER_CONTEXT/release-manifest.json"
          cat > "$CARRIER_CONTEXT/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY release-manifest.json /release-manifest.json
          DOCKERFILE
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$source_url" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$carrier_ref" "$CARRIER_CONTEXT"
          if ! push_log=$(docker push "$carrier_ref" 2>&1); then
            printf '%s\n' "$push_log"
            exit 1
          fi
          printf '%s\n' "$push_log"
          carrier_digest=$(printf '%s\n' "$push_log" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)
          [[ "$carrier_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { printf 'could not parse manifest carrier registry digest\n' >&2; exit 1; }
          docker image rm "$carrier_ref" >/dev/null
          bash scripts/fetch-release-manifest.sh "$SOURCE_SHA" "$carrier_digest" "$FETCHED_MANIFEST"
          cmp release-manifest.json "$FETCHED_MANIFEST"
          python3 scripts/validate-release-manifest.py "$FETCHED_MANIFEST" ghcr.io/yykx682436 myshop >/dev/null
          {
            printf 'source_sha=%s\nmanifest_carrier_ref=%s\nmanifest_carrier_digest=%s\n' \
              "$SOURCE_SHA" "$carrier_ref" "$carrier_digest"
          } >> "$GITHUB_STEP_SUMMARY"
