name: MyShop CI

on:
  workflow_dispatch:

concurrency:
  group: myshop-manual-release
  queue: max
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  MYSHOP_REGISTRY: ghcr.io/yykx682436

jobs:
  scope:
    name: Select test and image scopes
    runs-on: ubuntu-latest
    outputs:
      api_test: ${{ steps.changes.outputs.api_test }}
      web_test: ${{ steps.changes.outputs.web_test }}
      compose_test: ${{ steps.changes.outputs.compose_test }}
      api_image: ${{ steps.changes.outputs.api_image }}
      web_image: ${{ steps.changes.outputs.web_image }}
      runtime: ${{ steps.changes.outputs.runtime }}
      migration: ${{ steps.changes.outputs.migration }}
      baseline_sha: ${{ steps.changes.outputs.baseline_sha }}
      baseline_run_id: ${{ steps.changes.outputs.baseline_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the latest successful release
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci-release-scope.py

  api:
    needs: scope
    if: ${{ needs.scope.outputs.api_test == 'true' }}
    name: API build and tests
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install image and video processing test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libvips-tools libheif1 libheif-examples libheif-plugin-libde265 libheif-plugin-aomdec icc-profiles-free ffmpeg
      - name: Build and test, including required PostgreSQL integration tests
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker info --format 'server={{.ServerVersion}} containers={{.Containers}}'
          reports='target/surefire-reports/TEST-com.myshop.service.impl.AdminProductAssignedUuidIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.MigrationChainIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.OrderNumberConcurrencyIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.OrderRefundConcurrencyIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.SubsiteConcurrencyIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.SupplierPurchasePostgresIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.PostgresDeliveryIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.AfterSaleConcurrencyIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.BalanceAdjustmentConcurrencyIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.UserAvatarTransactionIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.CoreStabilityPostgresIntegrationTest.xml target/surefire-reports/TEST-com.myshop.service.impl.MediaMaintenancePostgresIntegrationTest.xml target/surefire-reports/TEST-com.myshop.controller.UploadControllerTest.xml target/surefire-reports/TEST-com.myshop.service.impl.UserLevelConcurrencyIntegrationTest.xml'
          rm -f $reports
          mvn -B verify
          REPORTS="$reports" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = [Path(value) for value in os.environ["REPORTS"].split()]
          results = []
          for report in reports:
              if not report.is_file():
                  raise SystemExit(f"Missing Surefire report: {report}")
              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", "0"))
              failures = int(suite.attrib.get("failures", "0"))
              errors = int(suite.attrib.get("errors", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              result = (f"{report.stem}: Tests run: {tests}, Failures: {failures}, "
                        f"Errors: {errors}, Skipped: {skipped}")
              results.append((result, tests, failures, errors, skipped))
              print(result)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### Required PostgreSQL/Testcontainers integration tests\n\n")
                  for result, *_ in results:
                      summary.write(f"- {result}\n")
          invalid = [result for result, tests, failures, errors, skipped in results
                     if tests <= 0 or failures != 0 or errors != 0 or skipped != 0]
          if invalid:
              raise SystemExit("PostgreSQL integration contract failed:\n" + "\n".join(invalid))
          PY
      - name: Package the exact tested API JAR and schema contract
        if: ${{ needs.scope.outputs.api_image == 'true' }}
        id: api-artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/myshop-api-build
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          sha=os.environ["SOURCE_SHA"]
          jars=[p for p in Path("apps/api/target").glob("myshop-api-*.jar")
                if p.is_file() and not p.name.endswith((".jar.original", "-sources.jar", "-javadoc.jar"))]
          if len(jars)!=1: raise SystemExit(f"expected exactly one executable API JAR, found {len(jars)}")
          artifact=Path(os.environ["ARTIFACT_DIR"])
          jar_bytes=jars[0].read_bytes()
          with zipfile.ZipFile(jars[0]) as archive:
              contract=archive.read("BOOT-INF/classes/db/production-schema-contract.json")
          (artifact/"app.jar").write_bytes(jar_bytes)
          (artifact/"production-schema-contract.json").write_bytes(contract)
          payload={"version":1,"source_sha":sha,
                   "jar_sha256":hashlib.sha256(jar_bytes).hexdigest(),
                   "schema_contract_sha256":hashlib.sha256(contract).hexdigest()}
          (artifact/"api-build-manifest.json").write_text(json.dumps(payload,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"jar_sha256={payload['jar_sha256']}\n")
          PY
          python3 scripts/validate-api-build-artifact.py "$ARTIFACT_DIR" "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        if: ${{ needs.scope.outputs.api_image == 'true' }}
        with:
          name: myshop-api-build-${{ github.sha }}
          path: ${{ runner.temp }}/myshop-api-build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Log in to GHCR
        if: ${{ needs.scope.outputs.api_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx and image cache
        if: ${{ needs.scope.outputs.api_image == 'true' }}
        uses: docker/setup-buildx-action@v3
      - name: Expose Actions cache to Buildx
        if: ${{ needs.scope.outputs.api_image == 'true' }}
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build and check runtime image from the tested JAR
        if: ${{ needs.scope.outputs.api_image == 'true' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          API_JAR_SHA256: ${{ steps.api-artifact.outputs.jar_sha256 }}
        run: |
          set -Eeuo pipefail
          image="$MYSHOP_REGISTRY/myshop-api:$SOURCE_SHA"
          context="$RUNNER_TEMP/myshop-api-image-context"
          mkdir -p "$context"
          cp "$RUNNER_TEMP/myshop-api-build/app.jar" "$context/app.jar"
          cp "$RUNNER_TEMP/myshop-api-build/production-schema-contract.json" "$context/production-schema-contract.json"
          python3 scripts/validate-api-build-artifact.py "$RUNNER_TEMP/myshop-api-build" "$SOURCE_SHA"
          docker buildx build --platform linux/amd64 --provenance=false \
            --file "$GITHUB_WORKSPACE/Dockerfile.api" --tag "$image" \
            --build-arg "SOURCE_SHA=$SOURCE_SHA" --build-arg "API_JAR_SHA256=$API_JAR_SHA256" \
            --cache-from type=gha,scope=myshop-api --cache-to type=gha,mode=max,scope=myshop-api \
            --load "$context"
          [[ "$(docker image inspect --format '{{index .Config.Labels "io.myshop.api.jar.sha256"}}' "$image")" == "$API_JAR_SHA256" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" == "$SOURCE_SHA" ]]
          printf '%s  /app/app.jar\n' "$API_JAR_SHA256" | docker run --rm -i --entrypoint /bin/sh "$image" -c 'sha256sum -c -'
          docker run --rm --entrypoint /bin/sh "$image" -c 'test "$(id -u)" = 10001 && test -x "$(command -v vipsthumbnail)" && test -x "$(command -v heif-info)"'
          docker run --rm --entrypoint /bin/sh \
            --volume "$GITHUB_WORKSPACE/scripts/probe-vips-image-formats.sh:/probe.sh:ro" \
            --volume "$GITHUB_WORKSPACE/apps/api/src/test/resources/media-formats:/samples:ro" \
            "$image" /probe.sh /samples/fox-derived.heic /samples/fox.avif
      - name: Push API image and verify registry digest
        if: ${{ needs.scope.outputs.api_image == 'true' }}
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
          API_JAR_SHA256: ${{ steps.api-artifact.outputs.jar_sha256 }}
        run: |
          set -Eeuo pipefail
          image="$MYSHOP_REGISTRY/myshop-api:$SOURCE_SHA"
          if ! push_log=$(docker push "$image" 2>&1); then printf '%s\n' "$push_log"; exit 1; fi
          printf '%s\n' "$push_log"
          digest=$(printf '%s\n' "$push_log" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$image@$digest"
          pulled_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image@$digest")
          pulled_jar_sha=$(docker image inspect --format '{{index .Config.Labels "io.myshop.api.jar.sha256"}}' "$image@$digest")
          [[ "$pulled_revision" == "$SOURCE_SHA" && "$pulled_jar_sha" == "$API_JAR_SHA256" ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  web:
    needs: scope
    if: ${{ needs.scope.outputs.web_test == 'true' }}
    name: Web checks and image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myshop/web exec tsc --noEmit
      - run: pnpm --filter @myshop/web test:logic
      - run: pnpm --filter @myshop/web test:legacy-image-cache
      - run: pnpm --filter @myshop/web lint
      - name: Build Next.js once for the image when Web changed
        if: ${{ needs.scope.outputs.web_image == 'true' }}
        run: pnpm --filter @myshop/web build
      - name: Stage standalone Web runtime output
        if: ${{ needs.scope.outputs.web_image == 'true' }}
        run: |
          set -Eeuo pipefail
          context="$RUNNER_TEMP/myshop-web-image-context"
          mkdir -p "$context/apps/web/.next"
          cp -a apps/web/.next/standalone/. "$context/"
          cp -a apps/web/.next/static "$context/apps/web/.next/static"
          cp -a apps/web/public "$context/apps/web/public"
          test -f "$context/apps/web/server.js"
      - name: Log in to GHCR
        if: ${{ needs.scope.outputs.web_image == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx and image cache
        if: ${{ needs.scope.outputs.web_image == 'true' }}
        uses: docker/setup-buildx-action@v3
      - name: Expose Actions cache to Buildx
        if: ${{ needs.scope.outputs.web_image == 'true' }}
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build Web image from the checked standalone output
        if: ${{ needs.scope.outputs.web_image == 'true' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          image="$MYSHOP_REGISTRY/myshop-web:$SOURCE_SHA"
          docker buildx build --platform linux/amd64 --provenance=false \
            --file "$GITHUB_WORKSPACE/Dockerfile.web" --tag "$image" \
            --build-arg "SOURCE_SHA=$SOURCE_SHA" \
            --cache-from type=gha,scope=myshop-web --cache-to type=gha,mode=max,scope=myshop-web \
            --load "$RUNNER_TEMP/myshop-web-image-context"
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" == "$SOURCE_SHA" ]]
          docker tag "$image" myshop-web:ci
          bash scripts/test-web-image-host-routing.sh
      - name: Push Web image and verify registry digest
        if: ${{ needs.scope.outputs.web_image == 'true' }}
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          image="$MYSHOP_REGISTRY/myshop-web:$SOURCE_SHA"
          if ! push_log=$(docker push "$image" 2>&1); then printf '%s\n' "$push_log"; exit 1; fi
          printf '%s\n' "$push_log"
          digest=$(printf '%s\n' "$push_log" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$image@$digest"
          pulled_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image@$digest")
          [[ "$pulled_revision" == "$SOURCE_SHA" ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  compose:
    needs: scope
    if: ${{ needs.scope.outputs.compose_test == 'true' }}
    name: Deployment contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test manifest, offline bundle, and release helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: bash scripts/test-storage-lifecycle.sh
      - run: bash scripts/test-deployment-transaction.sh
      - name: Check production shell syntax
        run: bash -n scripts/deploy-production.sh scripts/myshop-compose.sh scripts/fetch-release-manifest.sh scripts/import-offline-image-bundle.sh
      - run: bash scripts/test-production-schema-contract.sh
      - name: Check shared-server isolation, proxy, and preflight
        run: |
          bash scripts/test-shared-server-images.sh
          bash scripts/test-shared-server-proxy-config.sh
          bash scripts/test-shared-server-isolation.sh
          bash scripts/test-shared-server-preflight.sh
          bash scripts/test-shared-server-audit.sh
      - run: bash scripts/check-compose.sh

  release-manifest:
    name: Publish immutable release manifest
    needs: [scope, api, web, compose]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          needs.scope.result == 'success' && needs.scope.outputs.runtime == 'true' &&
          (needs.api.result == 'success' || (needs.scope.outputs.api_test == 'false' && needs.api.result == 'skipped')) &&
          (needs.web.result == 'success' || (needs.scope.outputs.web_test == 'false' && needs.web.result == 'skipped')) &&
          (needs.compose.result == 'success' || (needs.scope.outputs.compose_test == 'false' && needs.compose.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm release SHA is still current on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            printf 'Refusing stale release SHA %s; main is now %s\n' "$GITHUB_SHA" "$main_sha" >&2
            exit 1
          }
      - name: Fetch the previous validated full-service manifest
        if: ${{ needs.scope.outputs.baseline_sha != '' }}
        env:
          BASELINE_SHA: ${{ needs.scope.outputs.baseline_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-release-manifest.sh "$BASELINE_SHA" "$RUNNER_TEMP/base-release-manifest.json"
      - name: Compose the complete current release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASELINE_SHA: ${{ needs.scope.outputs.baseline_sha }}
          API_BUILD: ${{ needs.scope.outputs.api_image }}
          API_DIGEST: ${{ needs.api.outputs.image_digest }}
          WEB_BUILD: ${{ needs.scope.outputs.web_image }}
          WEB_DIGEST: ${{ needs.web.outputs.image_digest }}
          DATABASE_MIGRATION: ${{ needs.scope.outputs.migration }}
          OUTPUT_FILE: ${{ runner.temp }}/release-manifest.json
        run: python3 scripts/create-release-manifest.py
      - name: Validate full manifest and per-image ancestry
        env:
          SOURCE_SHA: ${{ github.sha }}
          MANIFEST: ${{ runner.temp }}/release-manifest.json
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-release-manifest.py "$MANIFEST" "$MYSHOP_REGISTRY" myshop > "$RUNNER_TEMP/validated-release-manifest.json"
          python3 scripts/validate-release-ancestry.py "$MANIFEST" "$SOURCE_SHA"
      - name: Confirm release SHA remains current before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            printf 'Refusing stale release SHA %s; main is now %s\n' "$GITHUB_SHA" "$main_sha" >&2
            exit 1
          }
      - name: Prepare checksummed manifest artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/myshop-release-manifest-$SOURCE_SHA"
          mkdir -p "$artifact"
          cp "$RUNNER_TEMP/release-manifest.json" "$artifact/"
          (cd "$artifact" && sha256sum release-manifest.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: myshop-release-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/myshop-release-manifest-${{ github.sha }}/
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
